name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - vue-legacy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout master (React 19 + Vite)
        uses: actions/checkout@v4
        with:
          ref: master
          path: react-app

      - name: Build React version
        working-directory: react-app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Checkout vue-legacy (Vue 2 + Webpack)
        uses: actions/checkout@v4
        with:
          ref: vue-legacy
          path: vue-app

      - name: Build Vue version
        working-directory: vue-app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble GitHub Pages distribution
        run: |
          mkdir -p pages-dist
          # 根路径：React 19 现代重写版
          cp -r react-app/dist/* pages-dist/
          # 子路径 /vue/：Vue 2 经典 1:1 复刻版 (cuber.90175.com)
          mkdir -p pages-dist/vue
          cp -r vue-app/dist/* pages-dist/vue/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
